<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Arial, Helvetica, sans-serif">
  <title>Arquitetura da plataforma Lumen e onde cada parte está hospedada</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a5fb4"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Usuários -->
  <rect x="40" y="300" width="240" height="300" rx="16" fill="#f4f7fb" stroke="#d6e0ee"/>
  <text x="160" y="335" text-anchor="middle" font-size="18" font-weight="bold" fill="#05285b">Usuários</text>
  <text x="160" y="358" text-anchor="middle" font-size="14" fill="#3d4d66">celular ou navegador</text>
  <g font-size="16" fill="#1c2a3f" text-anchor="middle">
    <text x="160" y="400">Morador</text><text x="160" y="430">Síndico</text><text x="160" y="460">Porteiro</text>
    <text x="160" y="490">Prestador</text><text x="160" y="520">Atendente</text><text x="160" y="550">Administrador</text>
  </g>

  <!-- VM -->
  <rect x="330" y="90" width="650" height="770" rx="18" fill="#eef3fa" stroke="#1a5fb4" stroke-width="2"/>
  <text x="350" y="118" font-size="17" font-weight="bold" fill="#05285b">VM Linux · Oracle Cloud, região São Paulo</text>
  <text x="350" y="140" font-size="14" fill="#3d4d66">Docker Compose · mesmo modelo de infra da SmartFit</text>

  <rect x="360" y="405" width="150" height="90" rx="12" fill="#ffffff" stroke="#8fb8ec" stroke-width="2"/>
  <text x="435" y="445" text-anchor="middle" font-size="17" font-weight="bold" fill="#05285b">nginx</text>
  <text x="435" y="468" text-anchor="middle" font-size="14" fill="#3d4d66">TLS, porta 443</text>

  <rect x="590" y="160" width="360" height="80" rx="12" fill="#ffffff" stroke="#8fb8ec" stroke-width="2"/>
  <text x="770" y="195" text-anchor="middle" font-size="17" font-weight="bold" fill="#05285b">Front React PWA</text>
  <text x="770" y="218" text-anchor="middle" font-size="14" fill="#3d4d66">build estático do Vite</text>

  <rect x="590" y="300" width="360" height="150" rx="12" fill="#1a5fb4"/>
  <text x="770" y="340" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">API FastAPI</text>
  <text x="770" y="364" text-anchor="middle" font-size="14" fill="#e6eefa">monolito modular, 1 módulo por contexto</text>
  <text x="770" y="392" text-anchor="middle" font-size="13" fill="#d5e5fa">identidade · carteira · reservas · chamados</text>
  <text x="770" y="412" text-anchor="middle" font-size="13" fill="#d5e5fa">portaria · comunicação · financeiro</text>
  <text x="770" y="432" text-anchor="middle" font-size="13" fill="#d5e5fa">inteligência</text>

  <rect x="590" y="530" width="360" height="80" rx="12" fill="#ffffff" stroke="#8fb8ec" stroke-width="2"/>
  <text x="770" y="565" text-anchor="middle" font-size="17" font-weight="bold" fill="#05285b">MinIO</text>
  <text x="770" y="588" text-anchor="middle" font-size="14" fill="#3d4d66">fotos, notas fiscais, regimentos</text>

  <rect x="590" y="690" width="360" height="110" rx="12" fill="#1a5fb4"/>
  <text x="770" y="730" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Worker</text>
  <text x="770" y="754" text-anchor="middle" font-size="14" fill="#e6eefa">lê a outbox, envia e tenta de novo</text>
  <text x="770" y="776" text-anchor="middle" font-size="14" fill="#e6eefa">jobs diários: vencimentos, lembretes</text>

  <!-- Supabase -->
  <rect x="1040" y="90" width="520" height="320" rx="18" fill="#d5e5fa" stroke="#05285b" stroke-width="2"/>
  <text x="1060" y="118" font-size="17" font-weight="bold" fill="#05285b">Supabase · região São Paulo · plano pago</text>
  <rect x="1070" y="140" width="460" height="80" rx="12" fill="#05285b"/>
  <text x="1300" y="175" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Supabase Auth</text>
  <text x="1300" y="198" text-anchor="middle" font-size="14" fill="#c9d8ee">login e emissão do JWT</text>
  <rect x="1070" y="260" width="460" height="120" rx="12" fill="#05285b"/>
  <text x="1300" y="298" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">PostgreSQL</text>
  <text x="1300" y="322" text-anchor="middle" font-size="14" fill="#c9d8ee">RLS por condomínio, auditoria por trigger</text>
  <text x="1300" y="344" text-anchor="middle" font-size="14" fill="#c9d8ee">tabela outbox de eventos</text>
  <text x="1300" y="366" text-anchor="middle" font-size="14" fill="#c9d8ee">backup gerenciado</text>

  <!-- Externos -->
  <rect x="1040" y="460" width="520" height="400" rx="18" fill="#f4f7fb" stroke="#d6e0ee" stroke-width="2"/>
  <text x="1060" y="488" font-size="17" font-weight="bold" fill="#3d4d66">Serviços externos (SaaS)</text>
  <rect x="1070" y="510" width="460" height="80" rx="12" fill="#ffffff" stroke="#8fb8ec" stroke-width="2"/>
  <text x="1300" y="545" text-anchor="middle" font-size="17" font-weight="bold" fill="#05285b">Asaas</text>
  <text x="1300" y="568" text-anchor="middle" font-size="14" fill="#3d4d66">Pix e boleto (fase 2)</text>
  <rect x="1070" y="630" width="460" height="80" rx="12" fill="#ffffff" stroke="#8fb8ec" stroke-width="2"/>
  <text x="1300" y="665" text-anchor="middle" font-size="17" font-weight="bold" fill="#05285b">Provedor de LLM</text>
  <text x="1300" y="688" text-anchor="middle" font-size="14" fill="#3d4d66">a definir, atrás de uma interface (fases 2 e 3)</text>
  <rect x="1070" y="750" width="460" height="80" rx="12" fill="#ffffff" stroke="#8fb8ec" stroke-width="2"/>
  <text x="1300" y="785" text-anchor="middle" font-size="17" font-weight="bold" fill="#05285b">WhatsApp Cloud API</text>
  <text x="1300" y="808" text-anchor="middle" font-size="14" fill="#3d4d66">Meta, mensagens por template</text>

  <!-- Ligações -->
  <g fill="none" stroke="#1a5fb4" stroke-width="2.5">
    <path d="M160,300 V50 H1480 V138" marker-end="url(#seta)"/>
    <path d="M280,450 H358" marker-end="url(#seta)"/>
    <path d="M435,405 V200 H588" marker-end="url(#seta)"/>
    <path d="M510,440 H588" marker-end="url(#seta)"/>
    <path d="M280,570 H588" stroke-dasharray="8 6" marker-end="url(#seta)"/>
    <path d="M770,450 V528" marker-end="url(#seta)"/>
    <path d="M950,320 L1068,190" marker-end="url(#seta)"/>
    <path d="M950,370 L1068,320" marker-end="url(#seta)"/>
    <path d="M950,415 L1068,550" marker-start="url(#seta)" marker-end="url(#seta)"/>
    <path d="M950,440 L1068,665" marker-end="url(#seta)"/>
    <path d="M950,710 C1010,710 1000,380 1068,370" stroke-dasharray="3 5" marker-end="url(#seta)"/>
    <path d="M950,780 L1068,790" marker-end="url(#seta)"/>
  </g>

  <g font-size="14" fill="#05285b">
    <rect x="600" y="32" width="360" height="26" fill="#ffffff"/>
    <text x="780" y="50" text-anchor="middle" font-weight="bold">1. login: o Supabase devolve o JWT</text>
    <rect x="285" y="420" width="70" height="22" fill="#ffffff"/>
    <text x="320" y="436" text-anchor="middle">HTTPS</text>
    <text x="512" y="190">páginas</text>
    <text x="514" y="430">/api, /ws</text>
    <text x="435" y="593" text-anchor="middle">arquivos por link assinado</text>
    <text x="780" y="494">gera link</text>
    <rect x="958" y="226" width="80" height="40" fill="#ffffff"/>
    <text x="998" y="242" text-anchor="middle">valida</text>
    <text x="998" y="260" text-anchor="middle">o JWT</text>
    <rect x="958" y="318" width="80" height="22" fill="#ffffff"/>
    <text x="998" y="334" text-anchor="middle">SQL+RLS</text>
    <rect x="985" y="455" width="56" height="40" fill="#ffffff"/>
    <text x="1013" y="471" text-anchor="middle">cobra /</text>
    <text x="1013" y="489" text-anchor="middle">webhook</text>
    <rect x="980" y="560" width="58" height="40" fill="#ffffff"/>
    <text x="1009" y="576" text-anchor="middle">NF,</text>
    <text x="1009" y="594" text-anchor="middle">regim.</text>
    <rect x="955" y="620" width="70" height="22" fill="#ffffff"/>
    <text x="990" y="636" text-anchor="middle">outbox</text>
    <rect x="975" y="760" width="62" height="22" fill="#ffffff"/>
    <text x="1006" y="776" text-anchor="middle">avisos</text>
  </g>
</svg>
