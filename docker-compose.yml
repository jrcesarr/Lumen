# Ambiente local completo: docker compose up
# (Auth fica no Supabase; para rodar o Auth local, use `supabase start`.)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lumen
    ports: ["5432:5432"]
    volumes:
      - db:/var/lib/postgresql/data
      - ./infra/dev-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 20

  migrate:
    build: ./backend
    depends_on: { db: { condition: service_healthy } }
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/lumen
    command: uv run --no-dev alembic upgrade head

  api:
    build: ./backend
    depends_on: { migrate: { condition: service_completed_successfully } }
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://app_backend:app_backend@db:5432/lumen
    ports: ["8000:8000"]

  # Entrega os eventos da outbox (hoje so registra no log).
  worker:
    build: ./backend
    depends_on: { migrate: { condition: service_completed_successfully } }
    environment:
      DATABASE_URL: postgresql+asyncpg://app_backend:app_backend@db:5432/lumen
    command: uv run --no-dev python -m app.jobs.worker

  web:
    image: node:22
    working_dir: /web
    volumes: [./frontend:/web]
    command: sh -c "npm ci && npm run dev -- --host"
    ports: ["5173:5173"]

  # S3 local SO PARA DESENVOLVIMENTO (fotos de chamados, comprovantes). Em producao os arquivos
  # ficam no Oracle Object Storage (ADR 0011). A imagem fica FIXA numa versao porque a edicao
  # comunitaria do MinIO nao recebe mais correcoes; nao use esta imagem fora do computador do dev.
  # Quando a primeira funcionalidade de arquivos entrar, trocar por um S3 mantido (Garage ou SeaweedFS).
  s3-dev:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    ports: ["9000:9000", "9001:9001"]
    volumes: [s3-dev:/data]

volumes:
  db:
  s3-dev:
