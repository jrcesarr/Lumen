name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-retries 20
    env:
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Prova que o backup diario gera um dump que restaura (ver infra/backup e docs/backup.md).
  backup:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-retries 20
    env:
      PGPASSWORD: postgres
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/lumen
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y --no-install-recommends postgresql-client-16
      - uses: astral-sh/setup-uv@v5
      - name: Banco com as migrations e um login de teste (o auth do Supabase e simulado)
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE lumen ENCODING 'UTF8' TEMPLATE template0"
          psql -h localhost -U postgres -d lumen -c "CREATE SCHEMA auth; CREATE TABLE auth.users (id uuid PRIMARY KEY DEFAULT gen_random_uuid(), email text, raw_user_meta_data jsonb)"
          cd backend && uv sync --frozen && uv run alembic upgrade head
          psql -h localhost -U postgres -d lumen -c "INSERT INTO auth.users (email) VALUES ('teste@lumen.test')"
      - name: Backup e restauracao
        run: |
          BACKUP_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/lumen BACKUP_DESTINO="$RUNNER_TEMP/backups" infra/backup/backup.sh
          RESTORE_ADMIN_URL=postgresql://postgres:postgres@localhost:5432/postgres infra/backup/restore-test.sh "$RUNNER_TEMP"/backups/diario/*.dump | tee restauracao.txt
          grep -q '^usuarios: 1$' restauracao.txt
